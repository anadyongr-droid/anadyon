name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 3"

# The analysis only needs to read the repository and upload its security
# findings. Keeping the token narrowly scoped limits the impact of a compromised
# workflow dependency.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned rather than a movable action tag. Dependabot is enabled to
      # keep this pin current through reviewable pull requests.
      #
      # All three steps come from one repository at one tag and must carry the
      # same SHA: init downloads the bundle analyze reads. Dependabot opens a
      # separate pull request per sub-path, so a bump is applied to all three
      # together. lib/actionPinParity.test.ts enforces that.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript

      - name: Build project
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
