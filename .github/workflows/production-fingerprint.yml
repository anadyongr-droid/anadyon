name: Nightly production fingerprint

# 00:10 UTC — forty minutes after the backup starts, so the two jobs do not
# compete for the same database at the same moment. Cron has no timezone; this
# drifts by an hour in winter, which does not matter for a nightly check.
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      simulate_early_failure:
        description: "Fail before reading production, to fire the alert path on demand"
        type: boolean
        default: false

# The post-event half of agent oversight, and the only part of it that can see
# the path the reviews all named as the largest residual risk: an action taken
# in a logged-in production dashboard. No hook sees a click. Production state
# does, because something that happened leaves a trace whatever route it took.
#
# What it compares: the structure the migrations build (replayed into PGlite
# here on the runner) against the structure production actually has. A
# difference is either declared in supabase/expected-changes/ — the ordinary
# case, since AGENTS.md forbids an agent applying a migration, so a human pastes
# it before the branch merges — or it is a change nobody declared, which is the
# thing worth waking up to.
#
# Why this job and not a step in the backup: the backup's job is to produce an
# archive, and a monitoring failure must not stop it uploading one. Separate
# jobs fail separately.
#
# THE CREDENTIAL NEVER REACHES AN AGENT. SUPABASE_DB_URL lives in Actions
# secrets, which neither Claude nor Codex can read, and the comparison script
# takes files rather than a connection string. An agent writes the check and
# never holds the key — which is the whole shape of the arrangement, since a
# control an agent could reach is a control an agent could quiet.

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the comparison scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      # PGlite is the expected side of the comparison: the migrations replayed.
      - name: Install dependencies
        run: npm ci

      # A missing secret is reported, not worked around. E21 is on the open
      # items list because CI's production drift step exits successfully without
      # comparing anything when its secrets are absent, which is worse than no
      # step at all: it looks like cover.
      - name: Refuse to run blind
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set, so there is nothing to compare production against. Reporting NOT RUN rather than passing."
            exit 1
          fi
          echo "  the connection string is present"

      # Read-only at the transaction level, not by inspection. PGOPTIONS sets
      # default_transaction_read_only for the session, so even a file that was
      # edited to write would be refused by the server — belt as well as braces,
      # since tests/productionFingerprint.test.ts only checks that the SQL
      # *contains* no writing statement.
      # **A way to fire the alert path on demand, and it exists because that path
      # had never fired.** The alert was widened on 4 October 2026 to trigger on
      # *any* earlier step failing, not just the comparison -- a missing secret, a
      # failed production query. Nothing failed early after that, so the fix was
      # configured and unexercised: the same criticism Codex rightly made of
      # `pgaudit`, and the shape of the four inert controls this project produced
      # in one week.
      #
      # Dispatching with `simulate_early_failure` makes this step exit non-zero
      # **before it connects to anything**, so the job fails exactly where a real
      # early failure would, with no production access at all. Re-fire it whenever
      # this workflow changes; a notification path is not a thing to believe in.
      - name: Read production's structure and row counts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000
          SIMULATE: ${{ inputs.simulate_early_failure }}
        run: |
          set -euo pipefail
          if [ "${SIMULATE:-false}" = "true" ]; then
            echo "::error::simulated early failure — firing the alert path on purpose, production was not read"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -f scripts/sql/production-fingerprint.sql > actual.json
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -f scripts/sql/production-counts.sql > counts.json
          # An empty file here is a failed query, not an empty database, and the
          # comparison script treats it that way. Checked twice because a
          # fingerprint of {} would make every comparison pass.
          for f in actual.json counts.json; do
            size=$(stat -c%s "$f")
            echo "  $f: $size bytes"
            [ "$size" -gt 50 ] || { echo "::error::$f is $size bytes — the query returned nothing"; exit 1; }
          done

      # Last night's counts, so a deletion is visible. Absent on the first run,
      # which the script reports as "cannot be detected tonight" rather than as
      # no deletions. Stored beside the backups, in the bucket that already has
      # credentials in this repository's secrets.
      - name: Fetch last night's row counts
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ACCOUNT="${R2_ACCOUNT_ID#https://}"
          ACCOUNT="${ACCOUNT%%.r2.cloudflarestorage.com*}"
          ACCOUNT="${ACCOUNT%%/*}"
          aws s3 cp "s3://$R2_BUCKET/fingerprint/counts-latest.json" previous-counts.json \
            --endpoint-url "https://${ACCOUNT}.r2.cloudflarestorage.com" || \
            echo "  no previous counts — first run, or the object is not there yet"

      # continue-on-error so tonight's counts still reach R2 when the comparison
      # fails. Without it a single alerting night would leave tomorrow with no
      # baseline, and the deletion check would be blind on exactly the night
      # after something happened.
      - name: Compare production with the migrations
        id: compare
        continue-on-error: true
        run: |
          set -o pipefail
          ARGS="--actual actual.json --counts counts.json --report report.md --counts-out counts-next.json"
          [ -f previous-counts.json ] && ARGS="$ARGS --previous previous-counts.json"
          node scripts/run-production-fingerprint.mjs $ARGS | tee "$GITHUB_STEP_SUMMARY"

      # **The report is readable from the API after this step, and was not before.**
      # Added 4 October 2026, after a run that found differences at `high` and
      # from which an agent could learn only that the job had failed: GitHub
      # serves logs and artifacts from a storage domain, so `gh api …/logs` and
      # the artifact zip both refuse in an agent container. Check-run annotations
      # *are* served by the API, so every unexplained row goes there too — one
      # annotation per severity, because GitHub shows at most ten of each level
      # per step and a night with fourteen `high` rows would silently lose four.
      - name: Make the findings readable without downloading the artifact
        if: always()
        run: |
          set -euo pipefail
          [ -f report.md ] || { echo "  no report to annotate"; exit 0; }
          node scripts/report-annotations.mjs report.md

      - name: Keep tonight's counts for tomorrow
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          [ -f counts-next.json ] || { echo "  nothing to store"; exit 0; }
          ACCOUNT="${R2_ACCOUNT_ID#https://}"
          ACCOUNT="${ACCOUNT%%.r2.cloudflarestorage.com*}"
          ACCOUNT="${ACCOUNT%%/*}"
          ENDPOINT="https://${ACCOUNT}.r2.cloudflarestorage.com"
          aws s3 cp counts-next.json "s3://$R2_BUCKET/fingerprint/counts-latest.json" --endpoint-url "$ENDPOINT"
          aws s3 cp counts-next.json \
            "s3://$R2_BUCKET/fingerprint/history/counts-$(date -u +%Y-%m-%d).json" --endpoint-url "$ENDPOINT"

      # The report carries no customer data — it is catalog facts and
      # cardinalities, which tests/productionFingerprint.test.ts asserts against
      # a seeded canary — so an artifact is safe. 30 days is enough to read back
      # over a month and see when a difference first appeared.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-fingerprint
          path: report.md
          retention-days: 30

      # Only when something needs a person. A nightly "all clear" trains the
      # reader to skim, and then the one that matters is skimmed too — the same
      # reasoning as the backup's alert, and the same script, which checks
      # Telegram's answer rather than assuming the message arrived.
      #
      # **Two conditions, not one, and the second is the one that was missing.**
      # Until 4 October 2026 this read `steps.compare.outcome == 'failure'`
      # alone, so the only failure anybody was told about was a failure of the
      # comparison itself. A missing `SUPABASE_DB_URL`, a production query that
      # errored, an `npm ci` that broke — each of those fails the job *before*
      # the comparison runs, and GitHub applies an implicit `success()` to a step
      # with no status function, so this step was skipped and nothing was sent.
      # **The check went quiet in exactly the circumstances where it had stopped
      # checking**, which is the defect E21 is on the open items list for, in a
      # second place. Found by Codex, twice.
      #
      # `failure()` covers every earlier step; `steps.compare.outcome` is still
      # needed because that step is `continue-on-error`, so its failure leaves
      # the job's own status green.
      - name: Tell someone
        if: ${{ failure() || steps.compare.outcome == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # No report means the job failed before the comparison — so the
          # headline says that rather than leaving an empty message, and the run
          # URL is what the reader needs either way.
          if [ -f report.md ]; then
            HEADLINE=$(sed -n '3p' report.md 2>/dev/null || echo "**the nightly production check could not run**")
          else
            HEADLINE="**NOT RUN — the nightly production check failed before it compared anything**"
          fi
          # The counts line is what tells a reader on a phone whether tonight is
          # last night with the same unresolved rows or something new, which the
          # headline alone cannot say.
          COUNTS=""
          if [ -f report.md ]; then
            COUNTS=$(node scripts/report-annotations.mjs report.md --counts-line 2>/dev/null || true)
          fi
          MESSAGE="Production fingerprint: ${HEADLINE}
          ${COUNTS}
          ${RUN_URL}"
          node scripts/send-telegram-alert.mjs "$MESSAGE"

      # Last, so the alert and the stored counts happen first. The job's status
      # is the comparison's status: a difference nothing explains is a failure.
      - name: Fail if the comparison did
        if: steps.compare.outcome == 'failure'
        run: |
          echo "::error::production differs from the repository in ways nothing explains, or the check could not run — see the step summary and report.md"
          exit 1
