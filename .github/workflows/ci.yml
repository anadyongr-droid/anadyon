name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must match what Vercel runs. CI was on 20 while production served
          # on 24, so anything that behaves differently between the two — and
          # Node majors do — would pass here and fail there.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Runs before the build: a logic regression should stop the pipeline at
      # the cheapest point, not after a full Next.js compile.
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # CI only proves the project compiles — it never talks to Supabase.
          # lib/supabase.ts builds its clients at module scope, so these must be
          # syntactically valid or page-data collection throws "supabaseUrl is
          # required". Fall back to placeholders when the secrets are unset.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          RESEND_API_KEY: placeholder
          RECAPTCHA_SECRET_KEY: placeholder
        run: npm run build

      # These three read the built HTML in .next/server/app, so they can only run
      # once the build has produced it. They catch what source review does not: a
      # translated page still rendering English, a heading level skipped in the
      # output, and a page shipping without alternate-language links.
      #
      # The last is not hypothetical — six English pages went live with no
      # hreflang at all, because their source had an `alternates` block that
      # simply contained no `languages`.
      - name: Translation audit
        run: npm run check:translation

      - name: Accessibility audit
        run: npm run check:a11y

      - name: SEO metadata audit
        run: npx vitest run lib/seo.test.ts

      # Catches a column the migrations declare but the database never received.
      # That drift is invisible at build time — the code compiles, and the query
      # only fails when a request reaches it. It once meant the Stripe webhook
      # could not record a paid deposit, with no symptom until someone asked why
      # a confirmed payment still showed as pending.
      #
      # Skipped unless a real service-role key is configured, since the rest of
      # CI deliberately runs on placeholders and never contacts Supabase. Adding
      # that secret widens what a compromised Actions run could reach, so it is
      # opt-in: without it this step passes quietly and the check stays a manual
      # `npm run check:schema` before deploying anything schema-dependent.
      - name: Schema drift check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Supabase credentials not configured — skipping schema drift check."
            echo "Run 'npm run check:schema' locally before deploying schema changes."
            exit 0
          fi
          npm run check:schema
