name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a label the
      # publisher can move, so `@v4` means "whatever they call v4 today" — and
      # these run with access to this repository's secrets.
      #
      # supabase/setup-cli@v1 was the sharpest case: v1 there is a BRANCH, not
      # a tag, so it moved with every push to it. The trailing comments are the
      # human-readable version each SHA corresponds to, verified against the
      # tag list rather than assumed.
      #
      # The cost is that these no longer update themselves. Dependabot updates
      # SHA pins and opens a PR with the version diff, which is the intended
      # way to keep them current — it needs enabling in repository settings.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Must match what Vercel runs. CI was on 20 while production served
          # on 24, so anything that behaves differently between the two — and
          # Node majors do — would pass here and fail there.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Runs before the build: a logic regression should stop the pipeline at
      # the cheapest point, not after a full Next.js compile.
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # CI only proves the project compiles — it never talks to Supabase.
          # lib/supabase.ts builds its clients at module scope, so these must be
          # syntactically valid or page-data collection throws "supabaseUrl is
          # required". Fall back to placeholders when the secrets are unset.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          RESEND_API_KEY: placeholder
          RECAPTCHA_SECRET_KEY: placeholder
        run: npm run build

      # These three read the built HTML in .next/server/app, so they can only run
      # once the build has produced it. They catch what source review does not: a
      # translated page still rendering English, a heading level skipped in the
      # output, and a page shipping without alternate-language links.
      #
      # The last is not hypothetical — six English pages went live with no
      # hreflang at all, because their source had an `alternates` block that
      # simply contained no `languages`.
      - name: Translation audit
        run: npm run check:translation

      - name: Accessibility audit
        run: npm run check:a11y

      - name: SEO metadata audit
        run: npm run test:seo

      # The suite that can see what the others cannot.
      #
      # Every check above reads source or prerendered HTML, and the booking form
      # exists in neither — it mounts only when a customer clicks Get Quote. Two
      # real defects reached production through that gap: the whole form
      # rendering in English while the translation audit passed 13 of 13 pages,
      # and the promo code button being pushed off narrow screens while the
      # responsive sweep passed every page.
      #
      # Chromium plus Firefox exercise two independent browser engines on every
      # change. WebKit remains in the separate on-demand run because its Linux
      # system dependencies have proved unreliable on the hosted runner.
      # Cached, because browser downloads change only with Playwright itself.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # v2 deliberately invalidates the former Chromium-only cache so the
          # first Firefox-enabled run cannot skip its missing browser download.
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Without --with-deps. That flag runs apt-get to install system
      # libraries, and it hung this job for nineteen minutes against a normal
      # run time of one. The GitHub Ubuntu image already carries what headless
      # Chromium needs; if that ever stops being true, Playwright fails with a
      # named missing library rather than hanging, which is the better failure.
      - name: Install Chromium and Firefox for browser tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox

      - name: Browser tests
        timeout-minutes: 10
        env:
          # `next start` is a separate step from the build, so it does not
          # inherit the build's environment. lib/supabase.ts constructs its
          # clients at module scope and throws "supabaseKey is required" the
          # moment a route is imported, so the server dies before the first
          # test connects. Same placeholders as the build: CI never contacts
          # Supabase, and the suite is written to skip the two rate-dependent
          # assertions when no card is served.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          RESEND_API_KEY: placeholder
          RECAPTCHA_SECRET_KEY: placeholder
        run: npm run test:browser

      - name: Upload browser test artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Catches a column the migrations declare but the database never received.
      # That drift is invisible at build time — the code compiles, and the query
      # only fails when a request reaches it. It once meant the Stripe webhook
      # could not record a paid deposit, with no symptom until someone asked why
      # a confirmed payment still showed as pending.
      #
      # Skipped unless a real service-role key is configured, since the rest of
      # CI deliberately runs on placeholders and never contacts Supabase. Adding
      # that secret widens what a compromised Actions run could reach, so it is
      # opt-in: without it this step passes quietly and the check stays a manual
      # `npm run check:schema` before deploying anything schema-dependent.
      - name: Schema drift check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            # Warns rather than passing silently.
            #
            # This used to print a plain line and exit 0, so a run in which the
            # check never happened looked exactly like one where it passed —
            # and the last green build had logged precisely that. A check that
            # reports success for something it did not look at is worse than no
            # check, because it gets believed. The absent storage bucket is
            # what that costs: schema the code required, missing from the
            # database, through a green pipeline.
            #
            # A warning rather than a hard failure only because the secrets are
            # deliberately opt-in — adding them widens what a compromised
            # Actions run could reach. Configure them and this becomes a real
            # gate; until then it is at least impossible to miss.
            echo "::warning title=Schema drift check skipped::No Supabase credentials configured, so the live schema was NOT verified. Run 'npm run check:schema' locally before deploying schema changes."
            exit 0
          fi
          npm run check:schema

  e2e-staging:
    name: End-to-end against staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: anadyon-staging-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run the commercial path against staging
        env:
          E2E_TARGET: staging
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$STAGING_SUPABASE_PROJECT_REF" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning title=Staging e2e skipped::Staging-only Supabase credentials are incomplete, so the commercial path was NOT exercised. Production credential names are deliberately unsupported."
            exit 0
          fi
          mkdir -p test-results
          npm run test:e2e -- --reporter=default --reporter=junit --outputFile.junit=test-results/e2e-junit.xml

      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-e2e-results
          path: test-results/
          retention-days: 7
